
name: MNQ MGC Pattern Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "10 8 * * 1-5"
      timezone: "America/Chicago"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install market data library
        run: python -m pip install yfinance

      - name: Download futures candles
        run: python fetch_data.py

      - name: Check candle data
        run: |
          test -s MNQ.csv
          test -s MGC.csv

      - name: Scan for patterns
        run: python scanner.py | tee results.txt

      - name: Save scan results
        uses: actions/upload-artifact@v4
        with:
          name: futures-scan
          path: |
            MNQ.csv
            MGC.csv
            results.txt
